<!-- maquina.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Caça Niquel</title>
</head>
<body>
    <h1>Jogo de Caça Niquel</h1>

    <form method="POST">
        <label for="aposta">Valor da Aposta:</label>
        <input type="number" name="aposta" id="aposta" min="1" max="{{ dados.saldo }}" required>
        <button type="submit">Apostar</button>
    </form>

    {% if resultado %}
        <h2>{{ resultado }}</h2>
    {% endif %}

    <br>
    <a href="{{ url_for('home') }}">Voltar para a Home</a>
</body>
</html>
